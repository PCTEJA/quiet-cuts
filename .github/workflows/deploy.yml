name: Deploy website code
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '!dist/data/**'
      - 'scripts/deploy_netlify.py'
      - 'netlify.toml'
      - 'package.json'
      - '.github/workflows/deploy.yml'
permissions:
  contents: read
concurrency:
  group: quiet-cuts-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Verify website
        run: npm test
      - name: Publish changed website assets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: python scripts/deploy_netlify.py
